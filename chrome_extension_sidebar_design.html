<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>크롬 확장 프로그램 사이드바 홈 스크린</title>
<link href="tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased selection:bg-primary/20">
<!-- Sidebar Container -->
<div class="mx-auto flex h-screen w-full max-w-[400px] flex-col overflow-hidden bg-white dark:bg-slate-900 shadow-xl border-r border-slate-200 dark:border-slate-800">
<!-- Header -->
<header class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 px-5 py-4">
<div class="flex items-center gap-3">
<div class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary/10 text-primary">
<span class="material-symbols-outlined text-[20px]">cloud_download</span>
</div>
<h1 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white">빠른 다운로드</h1>
</div>
<button class="flex h-8 w-8 items-center justify-center rounded-full text-slate-400 hover:bg-slate-100 hover:text-slate-600 dark:hover:bg-slate-800 dark:hover:text-slate-200 transition-colors">
<span class="material-symbols-outlined text-[20px]">settings</span>
</button>
</header>
<!-- Navigation Tabs -->
<nav class="flex w-full border-b border-slate-100 dark:border-slate-800">
<a class="flex flex-1 items-center justify-center border-b-2 border-primary py-3 text-sm font-semibold text-primary transition-colors" href="#">
                홈
            </a>
<a class="flex flex-1 items-center justify-center border-b-2 border-transparent py-3 text-sm font-medium text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 transition-colors" href="#">
                다운로드
            </a>
<a class="flex flex-1 items-center justify-center border-b-2 border-transparent py-3 text-sm font-medium text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 transition-colors" href="#">
                설정
            </a>
</nav>
<!-- Scrollable Content -->
<main class="flex-1 overflow-y-auto p-5 scrollbar-hide">
<!-- URL Input Section -->
<div class="mb-8 space-y-4">
<div class="space-y-2">
<label class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400" for="url-input">파일 URL</label>
<div class="relative">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
<span class="material-symbols-outlined text-[20px]">link</span>
</div>
<input class="block w-full rounded-xl border-slate-200 bg-slate-50 py-3 pl-10 pr-3 text-sm text-slate-900 placeholder:text-slate-400 focus:border-primary focus:bg-white focus:ring-primary dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:placeholder:text-slate-500 dark:focus:bg-slate-800" id="url-input" placeholder="https://example.com/file.zip" type="text"/>
</div>
</div>
<button class="group relative flex w-full items-center justify-center gap-2 overflow-hidden rounded-xl bg-primary px-4 py-3.5 text-sm font-bold text-white shadow-lg shadow-primary/25 transition-all hover:bg-blue-600 hover:shadow-primary/40 active:scale-[0.98]">
<span class="material-symbols-outlined text-[20px]">download</span>
<span>다운로드 시작</span>
</button>
</div>
<!-- Recent Downloads Section -->
<div>
<div class="mb-4 flex items-center justify-between">
<h3 class="text-sm font-bold text-slate-900 dark:text-white">최근 다운로드</h3>
<button class="text-xs font-medium text-primary hover:text-blue-600 dark:hover:text-blue-400">모두 보기</button>
</div>
<div class="space-y-3">
<!-- Download Item: Active -->
<div class="group relative overflow-hidden rounded-xl border border-slate-100 bg-white p-3 shadow-sm transition-all hover:border-primary/30 hover:shadow-md dark:border-slate-800 dark:bg-slate-800/50">
<div class="flex items-start gap-3">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-blue-50 text-primary dark:bg-blue-900/20">
<span class="material-symbols-outlined">description</span>
</div>
<div class="flex min-w-0 flex-1 flex-col gap-1">
<div class="flex items-center justify-between">
<p class="truncate text-sm font-semibold text-slate-900 dark:text-white">project_proposal_v2.pdf</p>
<span class="text-xs font-medium text-primary">75%</span>
</div>
<div class="h-1.5 w-full overflow-hidden rounded-full bg-slate-100 dark:bg-slate-700">
<div class="h-full w-[75%] rounded-full bg-primary transition-all duration-500"></div>
</div>
<div class="flex items-center justify-between text-[10px] text-slate-400">
<span>2.4 MB / 3.2 MB</span>
<span>12초 남음</span>
</div>
</div>
<button class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-slate-400 hover:bg-slate-100 hover:text-slate-600 dark:hover:bg-slate-700">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
</div>
<!-- Download Item: Completed -->
<div class="group relative overflow-hidden rounded-xl border border-slate-100 bg-white p-3 shadow-sm transition-all hover:border-slate-200 hover:shadow-md dark:border-slate-800 dark:bg-slate-800/50">
<div class="flex items-center gap-3">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-emerald-50 text-emerald-600 dark:bg-emerald-900/20 dark:text-emerald-400">
<span class="material-symbols-outlined">image</span>
</div>
<div class="flex min-w-0 flex-1 flex-col">
<p class="truncate text-sm font-semibold text-slate-900 dark:text-white">vacation_photo_01.jpg</p>
<div class="flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400">
<span>4.8 MB</span>
<span class="h-1 w-1 rounded-full bg-slate-300"></span>
<span>완료됨</span>
</div>
</div>
<div class="flex items-center gap-1 opacity-0 transition-opacity group-hover:opacity-100">
<button class="flex h-8 w-8 items-center justify-center rounded-full text-slate-400 hover:bg-slate-100 hover:text-slate-600 dark:hover:bg-slate-700">
<span class="material-symbols-outlined text-[18px]">folder_open</span>
</button>
</div>
</div>
</div>
<!-- Download Item: Completed -->
<div class="group relative overflow-hidden rounded-xl border border-slate-100 bg-white p-3 shadow-sm transition-all hover:border-slate-200 hover:shadow-md dark:border-slate-800 dark:bg-slate-800/50">
<div class="flex items-center gap-3">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-purple-50 text-purple-600 dark:bg-purple-900/20 dark:text-purple-400">
<span class="material-symbols-outlined">movie</span>
</div>
<div class="flex min-w-0 flex-1 flex-col">
<p class="truncate text-sm font-semibold text-slate-900 dark:text-white">tutorial_video_clip.mp4</p>
<div class="flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400">
<span>125 MB</span>
<span class="h-1 w-1 rounded-full bg-slate-300"></span>
<span>완료됨</span>
</div>
</div>
<div class="flex items-center gap-1 opacity-0 transition-opacity group-hover:opacity-100">
<button class="flex h-8 w-8 items-center justify-center rounded-full text-slate-400 hover:bg-slate-100 hover:text-slate-600 dark:hover:bg-slate-700">
<span class="material-symbols-outlined text-[18px]">folder_open</span>
</button>
</div>
</div>
</div>
<!-- Download Item: Failed/Cancelled -->
<div class="group relative overflow-hidden rounded-xl border border-slate-100 bg-white p-3 shadow-sm transition-all hover:border-slate-200 hover:shadow-md dark:border-slate-800 dark:bg-slate-800/50">
<div class="flex items-center gap-3">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-red-50 text-red-500 dark:bg-red-900/20 dark:text-red-400">
<span class="material-symbols-outlined">error_outline</span>
</div>
<div class="flex min-w-0 flex-1 flex-col">
<p class="truncate text-sm font-semibold text-slate-400 line-through dark:text-slate-500">unknown_archive.zip</p>
<div class="flex items-center gap-2 text-xs text-red-500 dark:text-red-400">
<span>취소됨</span>
</div>
</div>
<button class="flex h-8 w-8 items-center justify-center rounded-full text-slate-400 hover:bg-slate-100 hover:text-primary dark:hover:bg-slate-700">
<span class="material-symbols-outlined text-[18px]">refresh</span>
</button>
</div>
</div>
<!-- Download Item: Completed -->
<div class="group relative overflow-hidden rounded-xl border border-slate-100 bg-white p-3 shadow-sm transition-all hover:border-slate-200 hover:shadow-md dark:border-slate-800 dark:bg-slate-800/50">
<div class="flex items-center gap-3">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-orange-50 text-orange-600 dark:bg-orange-900/20 dark:text-orange-400">
<span class="material-symbols-outlined">folder_zip</span>
</div>
<div class="flex min-w-0 flex-1 flex-col">
<p class="truncate text-sm font-semibold text-slate-900 dark:text-white">assets_pack_final.zip</p>
<div class="flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400">
<span>42.1 MB</span>
<span class="h-1 w-1 rounded-full bg-slate-300"></span>
<span>완료됨</span>
</div>
</div>
<div class="flex items-center gap-1 opacity-0 transition-opacity group-hover:opacity-100">
<button class="flex h-8 w-8 items-center justify-center rounded-full text-slate-400 hover:bg-slate-100 hover:text-slate-600 dark:hover:bg-slate-700">
<span class="material-symbols-outlined text-[18px]">folder_open</span>
</button>
</div>
</div>
</div>
</div>
</div>
<!-- Empty State Spacer (Just to ensure scroll if needed) -->
<div class="h-10"></div>
</main>
<!-- Bottom Status Bar -->
<div class="border-t border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 px-5 py-3">
<div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
<div class="flex items-center gap-2">
<span class="flex h-2 w-2 rounded-full bg-emerald-500"></span>
<span>준비됨</span>
</div>
<span>v2.4.1</span>
</div>
</div>
</div>
</body></html>
